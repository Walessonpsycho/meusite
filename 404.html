<!DOCTYPE html>

    }
    main { max-width: 34rem; }
    img { width: 180px; height: auto; margin-bottom: 2.5rem; }
    h1 { font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.08; }
    h1 em { font-family: 'DM Serif Display', serif; font-weight: 400; font-style: italic; color: var(--rust); font-size: 1.12em; }
    p { margin-top: 1rem; color: var(--text-mid); line-height: 1.6; }

      display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 2rem; margin-top: 2rem;

    }
